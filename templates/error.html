<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Page</title>
</head>
<style>
  * {
    transition: all 0.6s;
  }

  .err {
    font-size: 30px;
    font-family: sans-serif;
    color: #888;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  input[type=submit] {
    background-color: #C8A936;
    font-weight: bold;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
</style>

<body>
  <div class="err">
    <h1>Error {{.NumErr}}</h1>
    <h2>{{.TextErr}}</h2>
    <form action="/">
      <input type="submit" value="Home">
    </form>
  </div>
</body>

</html>
