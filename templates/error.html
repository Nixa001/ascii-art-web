<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/images/logo.png" />
  <title>Error</title>
</head>
<style>
  * {
    transition: all 0.6s;
  }

  .err {
    height: 70vh;
    font-family: sans-serif;
    color: #004aad;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* align-content: center; */
  }

  .container {
    background-image: linear-gradient(135deg, #38b6ff 10%, #004aad 100%);
    font-weight: bold;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  a {
    text-decoration: none;
    font-size: 20px;
    color: #fff;
  }

  li {
    list-style: none;
  }

  .container:hover {
    background-image: linear-gradient(135deg, #38b6ff 10%, #38b6ff 100%);

  }

  h1 {
    font-size: 100px;
  }
</style>

<body>
  <div class="err">
    <h1>{{.errNum}}</h1>
    <p>{{.TextErr}}</p>
    <li>
      <a href="http://localhost:8080/">
        <button class="container">Home</button>
      </a>
    </li>
  </div>
</body>

</html>
